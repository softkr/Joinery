{{define "sprite"}}
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plug" viewBox="0 0 16 16"><path d="M5.5 1.8v3.4M10.5 1.8v3.4M3.8 5.2h8.4v2.6a4.2 4.2 0 01-8.4 0zM8 12v2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 2.8l8 5.2-8 5.2z" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13.2 8A5.2 5.2 0 113.4 5.4M13.4 2.2v3.4h-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.8 4.2h10.4M6.2 4.2V2.6h3.6v1.6M4 4.2l.6 9h6.8l.6-9M6.6 6.6v4.4M9.4 6.6v4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-key" viewBox="0 0 16 16"><circle cx="5" cy="10.6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.9 8.8L13 2.8M10.8 5l1.8 1.8M9.2 6.6l1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-first" viewBox="0 0 16 16"><path d="M4 3v10M12 3.5L6.5 8l5.5 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-prev" viewBox="0 0 16 16"><path d="M11 3.5L5.5 8l5.5 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 16 16"><path d="M5 3.5L10.5 8 5 12.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-filter" viewBox="0 0 16 16"><path d="M2 3.2h12L9.4 8.6v4.2L6.6 14V8.6z" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2v8M4.6 7l3.4 3.4L11.4 7M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-format" viewBox="0 0 16 16"><path d="M2.5 3.5h11M2.5 6.5h7M2.5 9.5h11M2.5 12.5h7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-open" viewBox="0 0 16 16"><path d="M1.8 4.2c0-.7.5-1.2 1.2-1.2h3l1.4 1.6h5.6c.7 0 1.2.5 1.2 1.2v1.2H4.4L1.8 12.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M4.4 7h10.4l-2.2 6.2H2z" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  </defs>
</svg>
{{end}}

{{define "layout"}}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Joinery</title>
  <link rel="icon" type="image/svg+xml" href="/static/joinery.svg">
  <script>
    // Theme before first paint: saved choice, else the system setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) { /* storage unavailable */ }
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/editor.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
{{template "sprite"}}
{{template "sprite2"}}

<header id="toolbar">
  <div class="brand"><img src="/static/joinery.svg" alt="" width="22" height="22"><b>Joinery</b></div>
  <div class="tb-spacer"><span id="win-title"></span></div>
  <button type="button" class="cmdk-btn" id="cmdk-btn" title="명령 팔레트">{{icon "search"}}<span>명령 · 테이블 검색</span><kbd id="cmdk-key">⌘K</kbd></button>
  <button class="tb" data-action="theme" id="theme-btn" title="라이트 / 다크 전환" aria-label="테마 전환">{{icon "moon"}}{{icon "sun"}}</button>
</header>

<div id="main">
  <aside id="sidebar">
    <div class="sb-actions" id="sb-actions">
      <button class="sbtn" hx-get="/conn/new" hx-target="#modal" hx-swap="innerHTML" title="새 연결" aria-label="새 연결">{{icon "tb-newconn"}}</button>
      <button class="sbtn" data-action="connect" data-needs="closed" title="선택한 연결 열기" aria-label="연결 열기" disabled>{{icon "tb-connect"}}</button>
      <button class="sbtn" data-action="disconnect" data-needs="live" title="선택한 연결 닫기" aria-label="연결 닫기" disabled>{{icon "tb-disconnect"}}</button>
      <button class="sbtn" data-action="refresh" title="연결 트리 새로고침 (F5)" aria-label="새로고침">{{icon "refresh"}}</button>
      <span class="sb-sep"></span>
      <button class="sbtn" data-action="new-query" data-needs="conn" title="새 쿼리 (선택한 연결/데이터베이스)" aria-label="새 쿼리" disabled>{{icon "tb-newquery"}}</button>
      <button class="sbtn" data-action="new-table" data-needs="db" title="새 테이블 (선택한 데이터베이스)" aria-label="새 테이블" disabled>{{icon "tb-newtable"}}</button>
      <button class="sbtn" data-action="objects" data-needs="db" title="선택한 데이터베이스의 오브젝트 목록" aria-label="오브젝트 목록" disabled>{{icon "tb-list"}}</button>
    </div>
    <div class="side-search">
      {{icon "search"}}<input id="tree-filter" type="search" placeholder="펼친 트리에서 이름 검색" aria-label="트리 검색" autocomplete="off" spellcheck="false">
      <button type="button" class="ns-btn" id="nav-live" title="연결된 항목만 표시" aria-pressed="false">{{icon "filter"}}</button>
    </div>
    <ul id="tree" class="tree" tabindex="0" role="tree" aria-label="연결 트리" hx-get="/tree/conns" hx-trigger="load, conns-changed from:body" hx-swap="innerHTML"></ul>
  </aside>
  <div id="resizer" role="separator" aria-orientation="vertical"></div>
  <section id="work">
    <div id="tabbar" role="tablist"></div>
    <div id="panels">
      <div id="welcome">
        <div class="welcome-card">
          <div class="logo"><img src="/static/joinery.svg" alt="" width="88" height="88"></div>
          <h1>Joinery</h1>
          <p>SQLite · PostgreSQL · MySQL / MariaDB</p>
          <button class="btn primary" hx-get="/conn/new" hx-target="#modal" hx-swap="innerHTML">새 연결 만들기</button>
          <p class="muted">왼쪽 트리에서 연결을 더블클릭하면 열립니다. 우클릭으로 메뉴를 사용하세요.<br><kbd class="cmdk-hint">⌘K</kbd> 로 명령 · 테이블 · 열린 탭을 검색할 수 있습니다.</p>
        </div>
      </div>
    </div>
  </section>
</div>

<footer id="statusbar"><span id="st-left">준비</span><span id="st-right"></span></footer>

<div id="modal"></div>
<div id="toasts" role="region" aria-label="알림"></div>
<div id="ctxmenu" class="ctxmenu" hidden></div>
<div id="palette" hidden></div>
</body>
</html>
{{end}}
